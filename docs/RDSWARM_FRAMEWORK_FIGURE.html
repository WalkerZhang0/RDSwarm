<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDSwarm Framework Figure</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #52606d;
      --line: #829ab1;
      --blue: #e8f1fb;
      --blue-line: #2b5c8a;
      --data: #f5f7fa;
      --data-line: #6b7280;
      --contract: #fff4d6;
      --contract-line: #b7791f;
      --future: #f3e8ff;
      --future-line: #7c3aed;
      --external: #e7f6ec;
      --external-line: #2f855a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #edf2f7;
      color: var(--ink);
      font: 15px/1.45 system-ui, -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 14px 22px; background: #fff; border-bottom: 1px solid #d9e2ec;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    button {
      min-width: 38px; height: 34px; padding: 0 10px; border: 1px solid #bcccdc;
      border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; font: inherit;
    }
    button:hover, button:focus-visible { border-color: var(--blue-line); background: var(--blue); outline: none; }
    #zoom-label { min-width: 54px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
    main { position: relative; min-height: 0; }
    #stage { width: 100%; height: 100%; display: block; background: #f8fafc; cursor: grab; touch-action: none; }
    #stage.dragging { cursor: grabbing; }
    .panel { fill: #fff; stroke: #bcccdc; stroke-width: 3; }
    .panel-title { fill: var(--ink); font-size: 24px; font-weight: 700; }
    .panel-note { fill: var(--muted); font-size: 15px; }
    .node { stroke-width: 2.4; }
    .current { fill: var(--blue); stroke: var(--blue-line); }
    .data { fill: var(--data); stroke: var(--data-line); }
    .contract { fill: var(--contract); stroke: var(--contract-line); }
    .future { fill: var(--future); stroke: var(--future-line); stroke-dasharray: 9 6; }
    .external { fill: var(--external); stroke: var(--external-line); stroke-dasharray: 6 5; }
    .node-title { fill: var(--ink); font-size: 16px; font-weight: 700; text-anchor: middle; }
    .node-sub { fill: var(--muted); font-size: 13px; text-anchor: middle; }
    .arrow { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
    .arrow.future-arrow { stroke: var(--future-line); stroke-dasharray: 8 6; }
    .arrow.external-arrow { stroke: var(--external-line); stroke-dasharray: 6 5; }
    .label { fill: var(--muted); font-size: 13px; font-weight: 600; text-anchor: middle; }
    .legend-box { rx: 6; ry: 6; stroke-width: 2; }
    .legend-text { fill: var(--ink); font-size: 14px; }
    .caption { fill: var(--muted); font-size: 15px; }
    .hint { position: absolute; right: 18px; bottom: 14px; padding: 7px 10px; border: 1px solid #d9e2ec; border-radius: 5px; background: rgba(255,255,255,.92); color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .toolbar { width: 100%; }
      .toolbar button { flex: 1; }
    }
  </style>
</head>

  <script>
    (() => {
      const svg = document.getElementById('stage');
      const viewport = document.getElementById('viewport');
      const label = document.getElementById('zoom-label');
      const initial = { x: 0, y: 0, scale: 1 };
      let view = { ...initial };
      let drag = null;

      function render() {
        viewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.scale})`);
        label.textContent = `${Math.round(view.scale * 100)}%`;
      }
      function zoom(factor, cx = 1200, cy = 725) {
        const next = Math.max(.35, Math.min(2.8, view.scale * factor));
        const ratio = next / view.scale;
        view.x = cx - (cx - view.x) * ratio;
        view.y = cy - (cy - view.y) * ratio;
        view.scale = next;
        render();
      }
      document.getElementById('zoom-in').addEventListener('click', () => zoom(1.2));
      document.getElementById('zoom-out').addEventListener('click', () => zoom(1 / 1.2));
      document.getElementById('reset').addEventListener('click', () => { view = { ...initial }; render(); });
      document.getElementById('fit').addEventListener('click', () => {
        view = { x: 0, y: 0, scale: 1 };
        render();
      });
      svg.addEventListener('wheel', event => {
        event.preventDefault();
        const box = svg.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width * 2400;
        const y = (event.clientY - box.top) / box.height * 1450;
        zoom(event.deltaY < 0 ? 1.12 : 1 / 1.12, x, y);
      }, { passive: false });
      svg.addEventListener('pointerdown', event => {
        drag = { x: event.clientX, y: event.clientY, tx: view.x, ty: view.y };
        svg.classList.add('dragging');
        svg.setPointerCapture(event.pointerId);
      });
      svg.addEventListener('pointermove', event => {
        if (!drag) return;
        const box = svg.getBoundingClientRect();
        view.x = drag.tx + (event.clientX - drag.x) / box.width * 2400;
        view.y = drag.ty + (event.clientY - drag.y) / box.height * 1450;
        render();
      });
      svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('dragging'); });
      svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('dragging'); });
      render();
    })();
  </script>
</body>
