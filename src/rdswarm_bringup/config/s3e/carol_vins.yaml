%YAML:1.0
---
imu: 1
num_of_cam: 1

imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "/tmp/rdswarm/carol"

cam0_calib: "carol_cam0.yaml"
image_width: 1224
image_height: 1024

# 原始 carol.yaml 的 Tic 将相机坐标变换到 IMU，直接对应 body_T_cam0。 (Ref: 2026-10-25_Add_S3E_Dual_VINS_Launch.md)
estimate_extrinsic: 0
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.00464162, -0.00460674, 0.99997862, 0.12607916,
          -0.99998633, 0.00238464, 0.00465265, 0.15840427,
          -0.00240602, -0.99998655, -0.00459561, 0.03420431,
           0.0, 0.0, 0.0, 1.0]

multiple_thread: 1
max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
flow_back: 1

use_superpoint: 0
superpoint_backend: "opencv"
superpoint_model_path: ""
superpoint_engine_path: ""
superpoint_score_threshold: 0.02
superpoint_max_keypoints: 1024
superpoint_border: 10
feature_diagnostics: 0
feature_diagnostics_path: ""

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

# 噪声字段沿用原始标定数值，尚未做 VINS 噪声一致性校验。 (Ref: 2026-10-25_Add_S3E_Dual_VINS_Launch.md)
acc_n: 1.1692699862662088e-02
gyr_n: 1.0216647894856925e-02
acc_w: 2.0413058951725431e-04
gyr_w: 8.4514305618965801e-05
g_norm: 9.81007

estimate_td: 0
td: 0.0
